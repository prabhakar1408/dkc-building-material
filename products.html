<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Products | DK Chaudhary Building Material &amp; Hardware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/effects.css">
<script>function fb(i){if(i.dataset.f)return;i.dataset.f=1;var m=i.src.match(/images\/([^\/?#.]+)\.[a-z]+/i);if(m)i.src="images/"+m[1]+".svg";}</script>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero" data-wave="bottom"><div class="container">
  <div class="breadcrumb">Home / Our Products</div><h1>Our Products</h1><p>Cement, Morang, Gitti, Sariya aur Hardware &mdash; sab ek jagah.</p>
</div></section>
<section class="section" style="padding-top:30px"><div class="container products-layout">
  <aside class="sidebar">
    <div class="side-card"><h3>Categories</h3><div class="side-cats" id="sideCats"></div></div>
    <div class="help-card"><h3>Need Help?</h3><p>Rate aur availability ke liye humse baat karein.</p><a class="btn btn-yellow btn-sm" href="tel:+919919291985">Call Now</a></div>
  </aside>
  <div>
    <input type="search" id="search" class="search" placeholder="Search products...">
    <div class="result-info" id="resultInfo"></div>
    <div class="products-grid" id="pg"></div>
  </div>
</div></section>
<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>
<script>
let activeCat = "All", query = "";
const sideCats = document.getElementById("sideCats");
const grid = document.getElementById("pg");
const info = document.getElementById("resultInfo");
const search = document.getElementById("search");

function drawSidebar() {
  const items = [["All", "All Products (" + PRODUCTS.length + ")"]].concat(PRODUCTS.map(p => [p.name, p.name]));
  sideCats.innerHTML = items.map(([key, label]) =>
    `<button class="cat-btn ${activeCat === key ? "active" : ""}" data-cat="${key}">${label}</button>`).join("");
  sideCats.querySelectorAll(".cat-btn").forEach(b => {
    b.onclick = () => { activeCat = b.dataset.cat; drawSidebar(); drawProducts(); };
  });
}

function drawProducts() {
  const list = PRODUCTS.filter(p => (activeCat === "All" || p.name === activeCat) && (p.name + " " + p.desc).toLowerCase().includes(query));
  info.textContent = list.length + " product categories \u00b7 Prices aur availability ke liye enquiry karein";
  let html = list.map(p => `
    <div class="product-card">
      <div class="circle">${img(p.img, p.name)}</div>
      <h3>${p.name}</h3><p>${p.desc}</p>
      <div class="actions">
        <a class="btn btn-red btn-sm" href="contact.html?product=${encodeURIComponent(p.name)}">Enquire Now</a>
        <a class="btn btn-green btn-sm" target="_blank" rel="noopener" href="${wa("Namaste, mujhe " + p.name + " ki jaankari chahiye.")}">WhatsApp</a>
      </div>
    </div>`).join("");
  if (!list.length) html = `<div class="no-result">Koi product nahi mila. Kuch aur search karein ya humse sampark karein.</div>`;
  html += `<div class="more-card"><h3>Kuch Aur Chahiye?</h3><p>Hardware ya material ki requirement batayein.</p><a class="btn btn-yellow btn-sm" href="contact.html">Send Enquiry</a></div>`;
  grid.innerHTML = html;
}

search.addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); drawProducts(); });
drawSidebar();
drawProducts();
</script>
</body>
</html>
