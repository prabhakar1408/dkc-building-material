<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | DK Chaudhary Building Material &amp; Hardware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/effects.css">
<script>function fb(i){if(i.dataset.f)return;i.dataset.f=1;var m=i.src.match(/images\/([^\/?#.]+)\.[a-z]+/i);if(m)i.src="images/"+m[1]+".svg";}</script>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero" data-wave="bottom"><div class="container">
  <div class="breadcrumb">Home / Gallery</div><h1>Gallery</h1><p>Hamare material, products aur business ki jhalak.</p>
</div></section>
<section class="section" style="padding-top:30px"><div class="container">
  <div class="filters">
    <button class="filter-btn active" data-f="All">All</button>
    <button class="filter-btn" data-f="Cement">Cement</button>
    <button class="filter-btn" data-f="Morang & Gitti">Morang &amp; Gitti</button>
    <button class="filter-btn" data-f="Sariya">Sariya</button>
    <button class="filter-btn" data-f="Hardware">Hardware</button>
    <button class="filter-btn" data-f="Branding">Branding</button>
  </div>
  <div class="gallery-grid" id="gallery">
    <div class="g-item g-big" data-cat="Branding"><img src="images/hero.png" alt="Building Materials" onerror="fb(this)"><span class="label">Building Materials</span></div>
    <div class="g-item g-wide" data-cat="Cement"><img src="images/cement.jpg" alt="Cement" onerror="fb(this)"><span class="label">Cement</span></div>
    <div class="g-item g-wide" data-cat="Sariya"><img src="images/sariya.jpg" alt="Sariya" onerror="fb(this)"><span class="label">Sariya</span></div>
    <div class="g-item" data-cat="Morang & Gitti"><img src="images/morang.jpg" alt="Morang" onerror="fb(this)"><span class="label">Morang</span></div>
    <div class="g-item" data-cat="Morang & Gitti"><img src="images/gitti.jpg" alt="Gitti" onerror="fb(this)"><span class="label">Gitti</span></div>
    <div class="g-item" data-cat="Hardware"><img src="images/hardware.jpg" alt="Hardware" onerror="fb(this)"><span class="label">Hardware</span></div>
    <div class="g-item g-empty" data-cat="Branding">[APPROVED BUSINESS PHOTOS YAHAN ADD HONGE]</div>
  </div>
</div></section>
<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>
<script>
const grid = document.getElementById("gallery");
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const f = btn.dataset.f;
    grid.classList.toggle("filtered", f !== "All");
    grid.querySelectorAll(".g-item").forEach(i => { i.style.display = (f === "All" || i.dataset.cat === f) ? "" : "none"; });
  };
});
</script>
</body>
</html>
